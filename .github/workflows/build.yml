name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon (arm64), macos-26-intel is Intel (x86_64).
        os: [macos-latest, macos-26-intel, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # rust-toolchain publishes no version tags (its v1 tag follows master), so pin the master commit of 2026-10-16.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2.9.3

      - run: cargo test --locked

      # Without a package.json, tauri-action installs @tauri-apps/cli v2 from npm and runs `tauri build`.
      # Builds are unsigned: no Apple signing or notarization and no Windows Authenticode yet.
      - uses: tauri-apps/tauri-action@v1.0.0
        with:
          projectPath: .

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: rustium-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  # Separate job so the write token never reaches cargo build scripts or dependencies.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist

      # A release made by hand for this tag gets its files replaced instead of failing the job.
      - name: Create draft release or update existing one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            find dist -type f -print0 | xargs -0 gh release upload "$GITHUB_REF_NAME" --clobber --repo "$GITHUB_REPOSITORY"
          else
            find dist -type f -print0 | xargs -0 gh release create "$GITHUB_REF_NAME" --draft --repo "$GITHUB_REPOSITORY"
          fi
