<svg xmlns="http://www.w3.org/2000/svg" width="880" height="392" viewBox="0 0 880 392" role="img" aria-labelledby="t d">
<title id="t">Memory with one WhatsApp account</title>
<desc id="d">macOS 26 on MacBook Pro, M1 Pro, 16 GB: WhatsApp app 215 MB, Ferdium 1,140 MB, rustium 1,408 MB; Windows 10 on AtlasOS, Dell Latitude 5490, Core i5-8350U, 16 GB DDR4: WhatsApp app 935 MB, Ferdium 1,141 MB, rustium 680 MB. Lower is better.</desc>
<style>
text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
.title { font-size: 18px; font-weight: 600; fill: #0b0b0b; }
.sub { font-size: 13px; fill: #52514e; }
.panel { font-size: 14px; font-weight: 600; fill: #0b0b0b; stroke: #fcfcfb; stroke-width: 4px; paint-order: stroke; }
.hw { font-weight: 400; fill: #898781; }
.label { font-size: 13px; fill: #52514e; }
.value { font-size: 13px; font-weight: 600; fill: #0b0b0b; font-variant-numeric: tabular-nums; }
.note { font-size: 13px; font-style: italic; fill: #898781; stroke: #fcfcfb; stroke-width: 4px; paint-order: stroke; }
.tick { font-size: 11px; fill: #898781; font-variant-numeric: tabular-nums; }
</style>
<rect width="880" height="392" rx="12" fill="#fcfcfb"/>
<text x="24" y="36" class="title">Memory with one WhatsApp account</text>
<text x="24" y="58" class="sub">Lower is better. macOS: physical footprint (Activity Monitor). Windows: private working set (Task Manager).</text>
<line x1="176" y1="96" x2="176" y2="358" stroke="#c3c2b7" stroke-width="1"/>
<text x="176" y="376" class="tick" text-anchor="middle">0</text>
<line x1="376.0" y1="96" x2="376.0" y2="358" stroke="#e1e0d9" stroke-width="1"/>
<text x="376.0" y="376" class="tick" text-anchor="middle">500 MB</text>
<line x1="576.0" y1="96" x2="576.0" y2="358" stroke="#e1e0d9" stroke-width="1"/>
<text x="576.0" y="376" class="tick" text-anchor="middle">1,000 MB</text>
<line x1="776.0" y1="96" x2="776.0" y2="358" stroke="#e1e0d9" stroke-width="1"/>
<text x="776.0" y="376" class="tick" text-anchor="middle">1,500 MB</text>
<text x="24" y="88" class="panel">macOS 26<tspan class="hw"> · MacBook Pro, M1 Pro, 16 GB</tspan></text>
<text x="164" y="116.0" class="label" text-anchor="end">WhatsApp app</text>
