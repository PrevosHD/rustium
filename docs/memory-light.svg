<text x="164" y="150.0" class="label" text-anchor="end">Ferdium</text>
<path d="M176 134h452a4 4 0 0 1 4 4v14a4 4 0 0 1 -4 4h-452z" fill="#a3a19a"><title>macOS 26, Ferdium: 1,140 MB</title></path>
<text x="640" y="150.0" class="value">1,140 MB</text>
<text x="164" y="184.0" class="label" text-anchor="end">rustium</text>
<path d="M176 168h559a4 4 0 0 1 4 4v14a4 4 0 0 1 -4 4h-559z" fill="#eb6834"><title>macOS 26, rustium: 1,408 MB</title></path>
<text x="747" y="184.0" class="value">1,408 MB</text>
