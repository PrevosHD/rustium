<svg xmlns="http://www.w3.org/2000/svg" width="880" height="392" viewBox="0 0 880 392" role="img" aria-labelledby="t d">
<title id="t">Memory with one WhatsApp account</title>
<desc id="d">macOS 26: WhatsApp app 215 MB, Ferdium 1,140 MB, rustium 1,408 MB. Windows 10: WhatsApp app 205 MB, Ferdium 1,141 MB, rustium 680 MB. Lower is better.</desc>
<style>
text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
.title { font-size: 18px; font-weight: 600; fill: #f0efec; }
.sub { font-size: 13px; fill: #c3c2b7; }
.panel { font-size: 14px; font-weight: 600; fill: #f0efec; }
.label { font-size: 13px; fill: #c3c2b7; }
.value { font-size: 13px; font-weight: 600; fill: #f0efec; font-variant-numeric: tabular-nums; }
.tick { font-size: 11px; fill: #898781; font-variant-numeric: tabular-nums; }
</style>
<rect width="880" height="392" rx="12" fill="#1a1a19"/>
<text x="24" y="36" class="title">Memory with one WhatsApp account</text>
<text x="24" y="58" class="sub">Lower is better. macOS: physical footprint (Activity Monitor). Windows: private working set (Task Manager).</text>
