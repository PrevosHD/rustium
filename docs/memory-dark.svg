<text x="576.0" y="376" class="tick" text-anchor="middle">1,000 MB</text>
<line x1="776.0" y1="96" x2="776.0" y2="358" stroke="#2c2c2a" stroke-width="1"/>
<text x="776.0" y="376" class="tick" text-anchor="middle">1,500 MB</text>
<line x1="176" y1="96" x2="176" y2="358" stroke="#383835" stroke-width="1"/>
<text x="176" y="376" class="tick" text-anchor="middle">0</text>
