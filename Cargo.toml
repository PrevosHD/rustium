[package]
name = "rustium"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Lightweight multi-account WhatsApp Web desktop app"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["unstable", "tray-icon"] }
tauri-plugin-notification = "2.8"
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Tauri commands take their extractors (State, Window, String args) by value.
needless_pass_by_value = "allow"
